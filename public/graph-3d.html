// ─── Colors ───
const COLORS = {
  api: "#ff6b6b",
  page: "#00d4ff",
  lib: "#a855f7",
  component: "#10b981",
  hook: "#f59e0b",
  upstox: "#ec4899",
  ai: "#06b6d4",
};

// Count incoming edges for sizing
const inDegree = {};
links.forEach(l => {
  inDegree[l.target] = (inDegree[l.target] || 0) + 1;
});

// ─── Build Graph ───
let particlesEnabled = true;
let spinning = true;

const Graph = ForceGraph3D()(document.getElementById("graph"))
  .backgroundColor("#0a0e17")
  .nodeVal(node => Math.max(3, (inDegree[node.id] || 0) * 1.5 + 2))
  .nodeColor(node => COLORS[node.group] || "#666")
  .nodeOpacity(0.95)
  .nodeResolution(12)
  .nodeLabel(node => `<div style="color:${COLORS[node.group]};font-weight:bold;font-size:13px">${node.label}</div><div style="color:#888;font-size:10px">${node.group} | ${node.id}</div>`)
  .linkColor(() => "rgba(100,150,255,0.15)")
  .linkWidth(0.5)
  .linkOpacity(0.5)
  .linkDirectionalParticles(2)
  .linkDirectionalParticleWidth(1.5)
  .linkDirectionalParticleSpeed(0.005)
  .linkDirectionalParticleColor(() => "#00d4ff")
  .linkCurvature(0.15)
  .onNodeClick(node => {
    const distance = 80;
    const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
    Graph.cameraPosition(
      { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
      node,
      1200
    );
  })
  .onNodeHover(node => {
    document.body.style.cursor = node ? "pointer" : "default";
  })
  .graphData({ nodes, links });

// Forces
Graph.d3Force("charge").strength(-80);
Graph.d3Force("link").distance(link => {
  const sNode = nodes.find(n => n.id === link.source.id || n.id === link.source);
  const tNode = nodes.find(n => n.id === link.target.id || n.id === link.target);
  if (sNode && tNode && sNode.group === tNode.group) return 25;
  return 55;
});

// Auto-rotate
let angle = 0;
function animate() {
  if (spinning) {
    angle += 0.002;
    const dist = 320;
    Graph.cameraPosition({
      x: dist * Math.sin(angle),
      z: dist * Math.cos(angle),
      y: 80
    });
  }
  requestAnimationFrame(animate);
}
animate();

// Stop spin on user interaction
const graphEl = document.getElementById("graph");
graphEl.addEventListener("mousedown", () => { spinning = false; });
graphEl.addEventListener("touchstart", () => { spinning = false; });

// ─── Controls ───
function toggleParticles() {
  particlesEnabled = !particlesEnabled;
  Graph.linkDirectionalParticles(particlesEnabled ? 2 : 0);
}

function resetCamera() {
  spinning = true;
  angle = 0;
}

function toggleSpin() {
  spinning = !spinning;
}
